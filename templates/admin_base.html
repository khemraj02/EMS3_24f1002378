<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar bg-dark">
        <div class="container">
            <span class="navbar-brand mb-1 h1 text-white">Admin Dashboard</span>
            <div class="d-flex gap-1">
                <a class="btn btn-outline-light" href="#">View Staistics</a>
                <a class="btn btn-outline-light" href="/login/0">Login</a>
            </div>
        </div>
    </nav>

    <main class="d-flex">
        <div class="sidebar">
            <h6 class="px-3">ADMINISTRATOR</h6>
            <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('manage_courses') }}" class="{% if request.endpoint == 'manage_courses' %}active{% endif %}">Manage Courses</a>
            <a href="{{ url_for('manage_examiners') }}" class="{% if request.endpoint == 'manage_examiners' %}active{% endif %}">Manage Examiners</a>
            <a href="{{ url_for('manage_students') }}" class="{% if request.endpoint == 'manage_students' %}active{% endif %}">Manage Students</a>
            <a href="{{ url_for('manage_exams') }}" class="{% if request.endpoint == 'manage_exams' %}active{% endif %}">Manage Examinations</a>
            <a href="{{ url_for('manage_slots') }}" class="{% if request.endpoint == 'manage_slots' %}active{% endif %}">Manage Slots</a>
            <a href="{{ url_for('manage_rubrics') }}" class="{% if request.endpoint == 'manage_rubrics' %}active{% endif %}">Manage Rubrics</a>
        </div>
 
        <div class="py-3 ms-3 w-100" style="overflow-y: scroll; height:86vh;">
            <div class="me-3">
                {% block main %}{% endblock %}
            </div>
        </div>
    </main>

    <footer>
        &copy; Examination Management Portal
    </footer>

    <template id="admin-dashboard-statistics">
    <section class="container-fluid">
        <div class="row g-3">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Students</h6>
                        <h3 data-value="total-students">0</h3>
                        <span>Registered Students</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Examiners</h6>
                        <h3 data-value="total-examiners">0</h3>
                        <span>Registered Examiners</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Courses</h6>
                        <h3 data-value="total-courses">0</h3>
                        <span>Available Courses</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Examinations</h6>
                        <h3 data-value="total-examinations">0</h3>
                        <span>Scheduled Examinations</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</template>

<template id="admin-course-record">
    <tr>
        <td data-field="course-id"></td>
        <td data-field="course-name"></td>
        <td data-field="course-code"></td>
        <td data-field="course-duration"></td>
        <td data-field="course-description"></td>
        <td>
            <span class="badge bg-success" data-field="course-status">
                Active
            </span>
        </td>
        <td>
            <div class="btn-group">
                <button type="button" class="btn btn-sm btn-outline-primary">
                    View
                </button>
                <button type="button" class="btn btn-sm btn-outline-warning">
                    Edit
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger">
                    Delete
                </button>
            </div>
        </td>
    </tr>
</template>

<template id="admin-student-record">
    <tr>
        <td data-field="student-id"></td>
        <td data-field="student-name"></td>
        <td data-field="student-email"></td>
        <td data-field="student-phone"></td>
        <td data-field="student-course"></td>
        <td data-field="student-registration-date"></td>
        <td>
            <span class="badge bg-success">Registered</span>
        </td>
    </tr>
</template>

<template id="admin-examiner-record">
    <tr>
        <td data-field="examiner-id"></td>
        <td data-field="examiner-name"></td>
        <td data-field="examiner-email"></td>
        <td data-field="examiner-specialization"></td>
        <td data-field="examiner-experience"></td>
        <td>
            <span class="badge bg-primary">Available</span>
        </td>
    </tr>
</template>

<template id="admin-examination-record">
    <tr>
        <td data-field="examination-id"></td>
        <td data-field="examination-name"></td>
        <td data-field="examination-course"></td>
        <td data-field="examination-date"></td>
        <td data-field="examination-time"></td>
        <td data-field="examination-duration"></td>
        <td>
            <span class="badge bg-info">Scheduled</span>
        </td>
    </tr>
</template>

<template id="admin-slot-record">
    <tr>
        <td data-field="slot-id"></td>
        <td data-field="slot-name"></td>
        <td data-field="slot-date"></td>
        <td data-field="slot-start-time"></td>
        <td data-field="slot-end-time"></td>
        <td data-field="slot-capacity"></td>
        <td>
            <span class="badge bg-success">Available</span>
        </td>
    </tr>
</template>

<template id="admin-rubric-record">
    <tr>
        <td data-field="rubric-id"></td>
        <td data-field="rubric-name"></td>
        <td data-field="rubric-description"></td>
        <td data-field="rubric-total-marks"></td>
        <td data-field="rubric-passing-marks"></td>
        <td data-field="rubric-created-date"></td>
        <td>
            <span class="badge bg-success">Active</span>
        </td>
    </tr>
</template>

<template id="admin-empty-record">
    <tr>
        <td colspan="8" class="text-center py-4">
            <div class="d-flex flex-column align-items-center">
                <h5>No Records Found</h5>
                <p class="text-muted">
                    There are currently no records available in this section.
                </p>
            </div>
        </td>
    </tr>
</template>

<template id="admin-pagination">
    <nav aria-label="Administration records pagination">
        <ul class="pagination justify-content-end">
            <li class="page-item">
                <a class="page-link" href="#">Previous</a>
            </li>
            <li class="page-item active">
                <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">3</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">Next</a>
            </li>
        </ul>
    </nav>
</template>

<template id="admin-search-section">
    <section class="mb-3">
        <div class="row g-2">
            <div class="col-md-6">
                <input
                    type="search"
                    class="form-control"
                    placeholder="Search records..."
                    aria-label="Search administration records"
                >
            </div>
            <div class="col-md-3">
                <select class="form-select" aria-label="Filter by status">
                    <option value="">All Statuses</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-outline-secondary w-100">
                    Clear Filters
                </button>
            </div>
        </div>
    </section>
</template>

<template id="admin-form-validation">
    <div class="alert alert-danger" role="alert">
        <h6 class="alert-heading">Please check the following fields</h6>
        <ul class="mb-0">
            <li data-field="validation-message"></li>
        </ul>
    </div>
</template>

<template id="admin-success-message">
    <div class="alert alert-success" role="alert">
        <strong>Success!</strong>
        <span data-field="success-message">
            The operation was completed successfully.
        </span>
    </div>
</template>

<template id="admin-exam-result">
    <div class="card">
        <div class="card-body">
            <h5>Examination Result</h5>
            <div class="row">
                <div class="col-md-6">
                    <p>Student Name</p>
                    <strong data-field="student-name"></strong>
                </div>
                <div class="col-md-6">
                    <p>Examination Name</p>
                    <strong data-field="exam-name"></strong>
                </div>
                <div class="col-md-4">
                    <p>Maximum Marks</p>
                    <strong data-field="maximum-marks"></strong>
                </div>
                <div class="col-md-4">
                    <p>Obtained Marks</p>
                    <strong data-field="obtained-marks"></strong>
                </div>
                <div class="col-md-4">
                    <p>Percentage</p>
                    <strong data-field="percentage"></strong>
                </div>
            </div>
            <hr>
            <div class="d-flex justify-content-between">
                <span>Final Result</span>
                <span class="badge bg-success" data-field="final-result">
                    Pass
                </span>
            </div>
        </div>
    </div>
</template>

<template id="admin-profile-information">
    <section class="card">
        <div class="card-body">
            <h5 class="card-title">Administrator Information</h5>
            <dl class="row">
                <dt class="col-sm-4">Administrator ID</dt>
                <dd class="col-sm-8" data-field="admin-id"></dd>
                <dt class="col-sm-4">Full Name</dt>
                <dd class="col-sm-8" data-field="admin-name"></dd>
                <dt class="col-sm-4">Email Address</dt>
                <dd class="col-sm-8" data-field="admin-email"></dd>
                <dt class="col-sm-4">Account Status</dt>
                <dd class="col-sm-8" data-field="admin-status"></dd>
                <dt class="col-sm-4">Last Login</dt>
                <dd class="col-sm-8" data-field="last-login"></dd>
            </dl>
        </div>
    </section>
</template>

<template id="admin-activity-record">
    <div class="list-group-item">
        <div class="d-flex justify-content-between">
            <h6 class="mb-1" data-field="activity-title"></h6>
            <small data-field="activity-date"></small>
        </div>
        <p class="mb-1" data-field="activity-description"></p>
        <small class="text-muted" data-field="activity-user"></small>
    </div>
</template>

<template id="admin-confirmation-dialog">
    <div class="modal" tabindex="-1" aria-labelledby="confirmation-title">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmation-title">
                        Confirm Action
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p data-field="confirmation-message">
                        Are you sure you want to continue?
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-danger">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="admin-table-header">
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col">Status</th>
            <th scope="col">Created Date</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
</template>

<template id="admin-dashboard-footer-information">
    <section class="container-fluid">
        <div class="row">
            <div class="col-md-4">
                <h6>System Information</h6>
                <p data-field="system-version"></p>
            </div>
            <div class="col-md-4">
                <h6>Examination Management</h6>
                <p data-field="system-description"></p>
            </div>
            <div class="col-md-4">
                <h6>Support Information</h6>
                <p data-field="support-information"></p>
            </div>
        </div>
    </section>
</template>

</body>
</html>
