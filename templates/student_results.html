{% extends "student_base.html" %}

{% block main %}
<div class="mb-3">
    <h2>Your Examination Results</h2>
    <p class="text-secondary">hlnl</p>
</div>

<div class="card shadow">
    <div class="card-body">
        <table class="table table-hover text-center">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Examination</th>
                    <th>Course</th>
                    <th>Exam Date</th>
                    <th>View Scorecard</th>
                    <th>Download</th>
                </tr>
            </thead>

            <tbody>
                {% for eval in results %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>kn</td>
                    <td>kn</td>
                    <td>kn</td>
                    <td>kn</td>
                    <td>
                        <a href="{{ url_for('download_scorecard', eval_id=eval.id) }}" class="btn btn-outline-info btn-sm">Download</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<template id="tpl-grading-scale">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Grading Scale</h5></div>
        <div class="card-body">
            <table class="table table-sm table-bordered text-center">
                <thead>
                    <tr>
                        <th scope="col">Percentage Range</th>
                        <th scope="col">Letter Grade</th>
                        <th scope="col">Grade Points</th>
                        <th scope="col">Remark</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>90 - 100</td><td>O</td><td>10</td><td>Outstanding</td></tr>
                    <tr><td>80 - 89</td><td>A+</td><td>9</td><td>Excellent</td></tr>
                    <tr><td>70 - 79</td><td>A</td><td>8</td><td>Very Good</td></tr>
                    <tr><td>60 - 69</td><td>B+</td><td>7</td><td>Good</td></tr>
                    <tr><td>50 - 59</td><td>B</td><td>6</td><td>Above Average</td></tr>
                    <tr><td>45 - 49</td><td>C</td><td>5</td><td>Average</td></tr>
                    <tr><td>40 - 44</td><td>P</td><td>4</td><td>Pass</td></tr>
                    <tr><td>Below 40</td><td>F</td><td>0</td><td>Fail</td></tr>
                    <tr><td>Not Appeared</td><td>AB</td><td>0</td><td>Absent</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</template>

<template id="tpl-semester-summary">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Semester Performance Summary</h5></div>
        <div class="card-body">
            <div class="row text-center">
                <div class="col-md-3">
                    <h6 class="text-secondary">Semester</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
                <div class="col-md-3">
                    <h6 class="text-secondary">Credits Registered</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
                <div class="col-md-3">
                    <h6 class="text-secondary">Credits Earned</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
                <div class="col-md-3">
                    <h6 class="text-secondary">SGPA</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
            </div>
            <hr>
            <div class="row text-center">
                <div class="col-md-4">
                    <h6 class="text-secondary">CGPA</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
                <div class="col-md-4">
                    <h6 class="text-secondary">Backlogs</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
                <div class="col-md-4">
                    <h6 class="text-secondary">Result Status</h6>
                    <p class="fs-5 mb-0">&mdash;</p>
                </div>
            </div>
        </div>
    </section>
</template>

<template id="tpl-marks-breakdown">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Marks Breakdown by Component</h5></div>
        <div class="card-body">
            <table class="table table-striped text-center align-middle">
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Internal Assessment</th>
                        <th scope="col">Mid Semester</th>
                        <th scope="col">Practical / Viva</th>
                        <th scope="col">End Semester</th>
                        <th scope="col">Total</th>
                        <th scope="col">Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>&mdash;</td>
                        <td>&mdash; / 20</td>
                        <td>&mdash; / 20</td>
                        <td>&mdash; / 20</td>
                        <td>&mdash; / 40</td>
                        <td>&mdash; / 100</td>
                        <td>&mdash;</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th scope="row" colspan="5" class="text-end">Aggregate</th>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </section>
</template>

<template id="tpl-pass-criteria">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Passing Criteria</h5></div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">Minimum in End Semester</dt>
                <dd class="col-sm-8">40 percent of the maximum marks</dd>
                <dt class="col-sm-4">Minimum Aggregate</dt>
                <dd class="col-sm-8">40 percent of the combined maximum marks</dd>
                <dt class="col-sm-4">Minimum in Practical</dt>
                <dd class="col-sm-8">50 percent of the practical maximum marks</dd>
                <dt class="col-sm-4">Attendance Eligibility</dt>
                <dd class="col-sm-8">75 percent attendance in each registered course</dd>
                <dt class="col-sm-4">Supplementary Attempts</dt>
                <dd class="col-sm-8">Permitted in the next scheduled examination cycle</dd>
                <dt class="col-sm-4">Grace Marks</dt>
                <dd class="col-sm-8">Applicable only as per institutional ordinance</dd>
            </dl>
        </div>
    </section>
</template>

<template id="tpl-course-outcomes">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Course Outcome Attainment</h5></div>
        <div class="card-body">
            <table class="table table-bordered table-sm text-center">
                <thead>
                    <tr>
                        <th scope="col">Course Outcome</th>
                        <th scope="col">Description</th>
                        <th scope="col">Questions Mapped</th>
                        <th scope="col">Marks Allotted</th>
                        <th scope="col">Marks Secured</th>
                        <th scope="col">Attainment Level</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>CO1</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                    <tr><td>CO2</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                    <tr><td>CO3</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                    <tr><td>CO4</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                    <tr><td>CO5</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</template>

<template id="tpl-exam-schedule">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Upcoming Examination Schedule</h5></div>
        <div class="card-body">
            <table class="table table-hover text-center align-middle">
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Day</th>
                        <th scope="col">Session</th>
                        <th scope="col">Course Code</th>
                        <th scope="col">Course Title</th>
                        <th scope="col">Venue</th>
                        <th scope="col">Seat Number</th>
                        <th scope="col">Reporting Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>Forenoon</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                    </tr>
                    <tr>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>Afternoon</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                        <td>&mdash;</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</template>

<template id="tpl-hall-ticket">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Hall Ticket Details</h5></div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <table class="table table-borderless mb-0">
                        <tbody>
                            <tr><th scope="row" class="w-50">Candidate Name</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Enrollment Number</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Programme</th><td>B.Tech Artificial Intelligence</td></tr>
                            <tr><th scope="row">Semester</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Examination Centre</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Centre Code</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Issue Date</th><td>&mdash;</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="col-md-4 text-center">
                    <div class="border p-4 mb-2">Photograph</div>
                    <div class="border p-3">Signature</div>
                </div>
            </div>
        </div>
    </section>
</template>

<template id="tpl-attendance">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Attendance Eligibility Record</h5></div>
        <div class="card-body">
            <table class="table table-sm table-striped text-center">
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Lectures Held</th>
                        <th scope="col">Lectures Attended</th>
                        <th scope="col">Percentage</th>
                        <th scope="col">Condonation</th>
                        <th scope="col">Eligibility</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</template>

<template id="tpl-revaluation-request">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Revaluation and Photocopy Request</h5></div>
        <div class="card-body">
            <form method="get">
                <fieldset class="mb-3">
                    <legend class="fs-6">Request Type</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="request_type" id="req-photocopy" value="photocopy">
                        <label class="form-check-label" for="req-photocopy">Photocopy of Answer Script</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="request_type" id="req-reval" value="revaluation">
                        <label class="form-check-label" for="req-reval">Revaluation</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="request_type" id="req-retotal" value="retotalling">
                        <label class="form-check-label" for="req-retotal">Re-totalling</label>
                    </div>
                </fieldset>
                <div class="mb-3">
                    <label for="req-course" class="form-label">Course</label>
                    <select class="form-select" id="req-course" name="course">
                        <option value="">Select a course</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="req-reason" class="form-label">Reason for Request</label>
                    <textarea class="form-control" id="req-reason" name="reason" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="req-fee" class="form-label">Fee Receipt Number</label>
                    <input type="text" class="form-control" id="req-fee" name="fee_receipt">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="req-declare" name="declaration">
                    <label class="form-check-label" for="req-declare">I declare that the information provided is correct.</label>
                </div>
                <button type="button" class="btn btn-outline-primary btn-sm" disabled>Submit Request</button>
            </form>
        </div>
    </section>
</template>

<template id="tpl-revaluation-status">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Revaluation Request Status</h5></div>
        <div class="card-body">
            <table class="table table-bordered text-center align-middle">
                <thead>
                    <tr>
                        <th scope="col">Request ID</th>
                        <th scope="col">Course</th>
                        <th scope="col">Type</th>
                        <th scope="col">Applied On</th>
                        <th scope="col">Original Marks</th>
                        <th scope="col">Revised Marks</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>
                </tbody>
            </table>
            <ol class="list-group list-group-numbered mt-3">
                <li class="list-group-item">Request Submitted</li>
                <li class="list-group-item">Fee Verified</li>
                <li class="list-group-item">Assigned to Examiner</li>
                <li class="list-group-item">Under Review</li>
                <li class="list-group-item">Outcome Published</li>
            </ol>
        </div>
    </section>
</template>

<template id="tpl-grievance">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Examination Grievance Redressal</h5></div>
        <div class="card-body">
            <form method="get">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="gr-category" class="form-label">Category</label>
                        <select class="form-select" id="gr-category" name="category">
                            <option value="">Select a category</option>
                            <option value="marks">Marks Discrepancy</option>
                            <option value="absent">Wrongly Marked Absent</option>
                            <option value="paper">Question Paper Issue</option>
                            <option value="hallticket">Hall Ticket Error</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="gr-exam" class="form-label">Examination</label>
                        <input type="text" class="form-control" id="gr-exam" name="examination">
                    </div>
                    <div class="col-12">
                        <label for="gr-details" class="form-label">Details</label>
                        <textarea class="form-control" id="gr-details" name="details" rows="4"></textarea>
                    </div>
                    <div class="col-12">
                        <label for="gr-proof" class="form-label">Supporting Document Reference</label>
                        <input type="text" class="form-control" id="gr-proof" name="proof">
                    </div>
                </div>
            </form>
        </div>
    </section>
</template>

<template id="tpl-notices">
    <section class="card mt-4">
        <div class="card-header"><h5 class="mb-0">Examination Notices</h5></div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">
                <h6 class="mb-1">Result Declaration</h6>
                <p class="mb-0 text-secondary">Results are declared course-wise after moderation by the examination cell.</p>
            </li>
            <li class="list-group-item">
                <h6 class="mb-1">Revaluation Window</h6>
                <p class="mb-0 text-secondary">Requests are accepted within the notified period after the result is published.</p>
            </li>
            <li class="list-group-item">
                <h6 class="mb-1">Supplementary Examination</h6>
                <p class="mb-0 text-secondary">Students with backlogs must register before the notified last date.</p>
            </li>
            <li class="list-group-item">
                <h6 class="mb-1">Scorecard Verification</h6>
                <p class="mb-0 text-secondary">Report any mismatch in the scorecard to the examination cell without delay.</p>
            </li>
        </ul>
    </section>
</template>

<template id="tpl-result-filters">
    <section class="card mt-4">
        <div class="card-body">
            <form method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="flt-sem" class="form-label">Semester</label>
                    <select class="form-select" id="flt-sem" name="semester">
                        <option value="">All</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="flt-type" class="form-label">Examination Type</label>
                    <select class="form-select" id="flt-type" name="exam_type">
                        <option value="">All</option>
                        <option value="internal">Internal</option>
                        <option value="midterm">Mid Semester</option>
                        <option value="practical">Practical</option>
                        <option value="final">End Semester</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="flt-status" class="form-label">Result Status</label>
                    <select class="form-select" id="flt-status" name="status">
                        <option value="">All</option>
                        <option value="pass">Pass</option>
                        <option value="fail">Fail</option>
                        <option value="absent">Absent</option>
                        <option value="withheld">Withheld</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="flt-year" class="form-label">Academic Year</label>
                    <input type="text" class="form-control" id="flt-year" name="year">
                </div>
            </form>
        </div>
    </section>
</template>

<template id="tpl-empty-state">
    <div class="card mt-4 text-center">
        <div class="card-body py-5">
            <h5>No Results Published</h5>
            <p class="text-secondary mb-0">Results will appear here once the examination cell publishes them.</p>
        </div>
    </div>
</template>

<template id="tpl-pagination">
    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled"><span class="page-link">Previous</span></li>
            <li class="page-item active"><span class="page-link">1</span></li>
            <li class="page-item"><span class="page-link">2</span></li>
            <li class="page-item"><span class="page-link">3</span></li>
            <li class="page-item"><span class="page-link">Next</span></li>
        </ul>
    </nav>
</template>

<template id="tpl-scorecard-modal">
    <div class="modal fade" id="scorecardModal" tabindex="-1" aria-labelledby="scorecardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="scorecardModalLabel">Scorecard</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-sm">
                        <tbody>
                            <tr><th scope="row">Examination</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Course</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Exam Date</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Marks Obtained</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Maximum Marks</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Percentage</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Grade</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Evaluated By</th><td>&mdash;</td></tr>
                            <tr><th scope="row">Remarks</th><td>&mdash;</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="tpl-verification-footer">
    <footer class="mt-4 pt-3 border-top text-secondary small">
        <p class="mb-1">This statement of marks is issued by the Examination Cell and is valid only with the official seal.</p>
        <p class="mb-1">Controller of Examinations</p>
        <p class="mb-0">Dr. Babasaheb Ambedkar Technological University, Lonere</p>
    </footer>
</template>

<template id="tpl-per-result-rows">
    <table class="table">
        <tbody>
            {% for eval in results %}
            <tr data-result-index="{{ loop.index }}" data-result-id="{{ eval.id }}">
                <td>{{ loop.index }}</td>
                <td>&mdash;</td>
                <td>&mdash;</td>
                <td>&mdash;</td>
                <td>&mdash;</td>
            </tr>
            {% endfor %}
        </tbody>
    </body>
</template>

{% endblock %}
